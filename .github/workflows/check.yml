# PR check of robarm-sw: a thin caller of xdmod's reusable workflow (xdmod/workflows/check.yml).
# It runs `curatrix check robarm-sw --stage pr --no-cad` in a workspace built from the manifest's
# main branch, with sibling repos resolved as described in D127.
name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    uses: tiacsys/xdmod/.github/workflows/curatrix-check.yml@main
    with:
      repo: robarm-sw
      role: sw
