# What `curatrix check robarm-sw` runs (format: xdmod/curatrix/README.md, "checks.yaml").
version: 1
area: robarm-sw

docs:                                   # CK-A6 strict docs build (SW docs + upstream se-req, se-arch)
  registry: docs/documents.yaml

ids:                                    # CK-C1, CK-C2
  ledger: ids.yaml
  exclude: ["*.md", "claude/**", ".github/**"]

requirements: true                      # CK-E2, CK-E3 on the SW requirements

# Firmware build and unit tests (CK-F5). They need the Zephyr SDK (tools.yaml), not CAD tools, so
# they also run in PR CI (D101). Output goes to build/robarm-sw/. The devicetree check (CK-F2)
# is added once the model has the joint interfaces.
commands:
  - id: CK-F5a
    name: firmware builds for nucleo_g474re
    run: ["west", "build", "--pristine", "auto", "-b", "nucleo_g474re",
          "-d", "{ws}/build/{area}/app/nucleo_g474re", "{repo}/app"]
    use: west-build
    cwd: "{ws}"
    stages: [local, pr, baseline]
  - id: CK-F5b
    name: ztest suites pass on native_sim (Twister)
    run: ["{python}", "{ws}/zephyr/scripts/twister", "-T", "{repo}/tests", "-p", "native_sim",
          "-O", "{ws}/build/{area}/twister", "--inline-logs"]
    use: tests
    cwd: "{ws}"
    stages: [local, pr, baseline]

# CK-H6: exactly the checks this repo runs (built-in and commands). A section that goes
# missing turns an expected check off, and CK-H6 fails.
expect: [
  CK-A1, CK-A3, CK-A6, CK-B1, CK-B2, CK-B3, CK-B5, CK-B6, CK-C1, CK-C2, CK-E2,
  CK-E3, CK-F5a, CK-F5b, CK-G1, CK-G2, CK-H1, CK-H2, CK-H3, CK-H4, CK-H6, CK-H7
]
