# What `curatrix check robarm-sw` runs (format: xdmod/curatrix/README.md, "checks.yaml").
version: 1
area: robarm-sw

docs:                                   # CK-A6 strict docs build (SW docs + upstream se-req, se-arch), CK-A7 layout
  registry: docs/documents.yaml

ids:                                    # CK-C1, CK-C2
  ledger: ids.yaml
  exclude: ["*.md", "claude/**", ".github/**"]

requirements: true                      # CK-E2, CK-E3 on the SW requirements

code:                                   # CK-D6: code units (@xdid) and test cases (above ZTEST)
  sources: ["app/src/**/*.[ch]"]        # -> generated/code-needs.json (`curatrix gen code-needs robarm-sw`)
  tests: ["tests/**/*.c"]

# Firmware build and unit tests (CK-F5). They need the Zephyr SDK (tools.yaml), not CAD tools, so
# they also run in PR CI (D101). Output goes to build/robarm-sw/. The devicetree check (CK-F2)
# is added once the model has the joint interfaces.
commands:
  - id: CK-F5a
    name: firmware builds for nucleo_g474re
    run: ["west", "build", "--pristine", "auto", "-b", "nucleo_g474re",
          "-d", "{ws}/build/{area}/app/nucleo_g474re", "{repo}/app"]
    use: west-build
    cwd: "{ws}"
    stages: [local, pr, baseline]
  - id: CK-F5b
    name: ztest suites pass on native_sim (Twister)
    run: ["{python}", "{ws}/zephyr/scripts/twister", "-T", "{repo}/tests", "-p", "native_sim",
          "-O", "{ws}/build/{area}/twister", "--inline-logs"]
    use: tests
    cwd: "{ws}"
    stages: [local, pr, baseline]
    before_docs: true                   # the SW test report of the same run shows its results
  - id: CK-F5c
    name: Twister results as preview TR needs for the SW test report
    run: ["{python}", "-m", "curatrix", "evidence", "preview", "{ws}/build/{area}/twister",
          "-o", "{build}/preview/tr-needs.json", "--tests", "{repo}/tests", "--commit-of", "{repo}"]
    use: script
    cwd: "{ws}"
    stages: [local, pr]                 # never at baseline: a preview is never evidence (D60)
    before_docs: true

# CK-H6: exactly the checks this repo runs (built-in and commands). A section that goes
# missing turns an expected check off, and CK-H6 fails.
expect: [
  CK-A1, CK-A3, CK-A6, CK-A7, CK-B1, CK-B2, CK-B3, CK-B5, CK-B6, CK-B7, CK-C1, CK-C2, CK-D6,
  CK-E2, CK-E3, CK-F5a, CK-F5b, CK-F5c, CK-G1, CK-G2, CK-H1, CK-H2, CK-H3, CK-H4, CK-H6, CK-H7
]
